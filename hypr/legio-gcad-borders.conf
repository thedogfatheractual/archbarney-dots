# ============================================================
# Legio GCAD — Hyprland Border & Decoration Theme
# Palette: Void Black / Oxblood / Imperial Gold
# ============================================================
# Usage: source this file from your main hyprland.conf, e.g.:
#   source = ~/.config/hypr/legio-gcad-borders.conf
# Then: hyprctl reload
# ============================================================

general {
    border_size = 3

    # Active window: bright red -> deep dark red slow chase gradient
    col.active_border = rgba(ff0033ee) rgba(220005ee) 45deg

    # Inactive: dim oxblood, low alpha, no gradient — recedes
    col.inactive_border = rgba(3d0c0c66)

    # Optional: nogroup border (for window groups, if you use them)
    col.nogroup_border_active = rgba(ff0033cc)
    col.nogroup_border = rgba(3d0c0c55)

    resize_on_border = true
    extend_border_grab_area = 12
    hover_icon_on_border = true
}

decoration {
    # rounding_power = 1.0 produces a true straight 45-degree faceted chamfer corner
    rounding = 8
    rounding_power = 1.0

    # Shadow tuned to read as a dim gold halo rather than generic drop shadow
    shadow {
        enabled = true
        range = 18
        render_power = 3
        color = rgba(d4af3744)
        color_inactive = rgba(0a090888)
    }

    # Active-window glow via blur tint (subtle, optional — comment out if too much)
    active_opacity = 1.0
    inactive_opacity = 0.92
}

# Group (tabbed) windows — keep palette consistent if you ever use groups
group {
    col.border_active = rgba(ffc845ee)
    col.border_inactive = rgba(3d0c0c66)
    col.border_locked_active = rgba(c41e3aee)
    col.border_locked_inactive = rgba(3d0c0c66)

    groupbar {
        col.active = rgba(6b1414ee)
        col.inactive = rgba(161311cc)
        text_color = rgba(e8dfc8ff)
    }
}

# Fullscreen border rule — keep gold visible even fullscreened, useful for streaming
windowrule = border_color rgba(ffc845ee) rgba(6b1414ee) 45deg, match:fullscreen true
