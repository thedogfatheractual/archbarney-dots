# ============================================================
# Legio GCAD — Kitty Terminal Theme
# Palette: Void Black / Oxblood / Imperial Gold
# Apply via: include in ~/.config/kitty/kitty.conf, e.g.:
#   include legio-gcad.conf
# Then: ctrl+shift+f5 (reload config) or restart kitty
# ============================================================

# Basic colors
foreground              #e8dfc8
background              #0a0908
selection_foreground    #0a0908
selection_background     #ffc845

# Cursor
cursor                  #ffc845
cursor_text_color       #0a0908

# URL underline color when hovering
url_color               #ffc845

# Kitty window border colors (when using kitty's own splits)
active_border_color     #ffc845
inactive_border_color   #3d0c0c
bell_border_color       #c41e3a

# Tab bar
active_tab_foreground   #0a0908
active_tab_background   #ffc845
inactive_tab_foreground #e8dfc8
inactive_tab_background #161311
tab_bar_background      #0a0908

# Mark colors (search highlighting)
mark1_foreground #0a0908
mark1_background #ffc845
mark2_foreground #0a0908
mark2_background #b8860b
mark3_foreground #e8dfc8
mark3_background #6b1414

# The 16 terminal colors
# black
color0   #0a0908
color8   #3d0c0c

# red
color1   #c41e3a
color9   #e8455c

# green (muted olive, reads ok against oxblood without clashing)
color2   #7a8450
color10  #9aa86c

# yellow / gold
color3   #ffc845
color11  #ffd970

# blue (cool, desaturated — accent breather color)
color4   #5d7a8a
color12  #7a9aab

# magenta (dusty oxblood-adjacent)
color5   #8a5d6b
color13  #aa7a8a

# cyan
color6   #5d8a82
color14  #7aaaa0

# white
color7   #e8dfc8
color15  #fff6e3
